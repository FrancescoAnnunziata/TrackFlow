name: CI

# Gira su ogni push e su ogni PR. Se il deploy parte da `master`, quello che
# passa di qui finisce sul server.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test e stile
    runs-on: ubuntu-latest

    services:
      mysql:
        # Stessa versione di Sail: i test toccano SQL vero, e le funzioni che
        # SQLite non ha si scoprono solo qui.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, intl, bcmath
          coverage: none

      - name: Cache delle dipendenze
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepara l'ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Stile (Pint)
        run: ./vendor/bin/pint --test

      - name: Test (Pest)
        run: php artisan test
